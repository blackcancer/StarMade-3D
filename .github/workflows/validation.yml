name: StarMade-3D validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code-and-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STARMADE_SHADER_ROOT: ${{ github.workspace }}/StarMade-Open/src/main/resources/data/shader
      STARMADE_OPEN_DIR: ${{ github.workspace }}/StarMade-Open
      CHROMIUM_PATH: /tmp/starmade-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          path: StarMade-3D
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: blackcancer/StarMade-Decoder
          ref: ed9d3becdb139eaf665c27a23c6ef3ef60d687d9
          path: StarMade-Decoder
          persist-credentials: false
      # This reference repository is private. No native corpus is committed here
      # or attached to artifacts. Fork PRs require a trusted maintainer run.
      - uses: actions/checkout@v4
        with:
          repository: blackcancer/StarMade-Open
          ref: e5a3b49d86943c4d618cea6512e28fa0b95901df
          token: ${{ secrets.STARMADE_REFERENCE_TOKEN }}
          path: StarMade-Open
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build pinned Decoder
        working-directory: StarMade-Decoder
        run: npm ci --ignore-scripts && npm run build
      - name: Install library development dependencies
        working-directory: StarMade-3D
        run: npm ci --ignore-scripts
      - name: Code, integration and per-file 100 percent gate
        working-directory: StarMade-3D
        run: npm run validate:code
      - name: Package consumer
        working-directory: StarMade-3D
        run: npm run test:package
      - name: Native Display variable catalog contract
        working-directory: StarMade-3D
        run: STARMADE_TEST_SUITE=game node node_modules/vitest/vitest.mjs run tests/integration/display.game.test.ts
      - name: CPU performance budgets
        working-directory: StarMade-3D
        run: npm run test:performance
      - name: Chromium software WebGL
        run: |
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox "$@"\n' > /tmp/starmade-chrome
          chmod +x /tmp/starmade-chrome
      - name: GPU regressions with external reference shaders
        working-directory: StarMade-3D
        run: npm run test:render
      - name: Runtime dependency audit
        working-directory: StarMade-3D
        run: npm audit --omit=dev
      - name: Preserve measured results, never native assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starmade-3d-validation
          path: |
            StarMade-3D/coverage/REPORT.md
            StarMade-3D/coverage/verdict.json
            StarMade-3D/validation/v1/package.json
            StarMade-3D/validation/v1/performance.json
            StarMade-3D/artifacts/render-parity/result.json
          retention-days: 14
