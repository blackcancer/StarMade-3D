<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StarMade — Inspection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101720;color:#e3edf4;font:14px system-ui}main{display:grid;grid-template-columns:310px 1fr;height:100vh}aside{padding:24px;overflow:auto;background:#17232f;border-right:1px solid #314555}h1{font-size:21px;margin:0 0 8px}p{line-height:1.5;color:#a9c0cf}label{display:block;margin:16px 0 7px}button,input,select{font:inherit;color:inherit;background:#263b4b;border:1px solid #496071;border-radius:5px;padding:8px}button{cursor:pointer;margin:4px 4px 4px 0}button:hover{background:#36556a}input[type=range]{width:100%}input[type=number]{width:100%}pre{white-space:pre-wrap;font-size:12px;line-height:1.5}#viewport{min-width:0;position:relative}canvas{display:block;width:100%;height:100%}#caption{position:absolute;bottom:18px;left:20px;background:#101720cc;padding:10px;border-radius:5px;pointer-events:none}select{max-width:100%}summary{margin-top:18px;cursor:pointer}#entity-tree button{display:block;text-align:left;width:100%}#legend{font-size:12px;line-height:1.8}a{color:#7de5ed}@media(max-width:700px){main{grid-template-columns:240px 1fr}aside{padding:16px}}
</style></head><body><main><aside><h1>Inspection StarMade</h1><p>Explorer les blocs, couper une création et comparer ses états.</p>
<button id="fixture">Création de démonstration</button><button id="isanth">Charger Isanth</button>
<details open><summary>Entités et sous-dockings</summary><div id="entity-tree"></div><label><input id="descendants" type="checkbox" checked> Inclure les sous-dockings</label><pre id="entity-info"></pre></details>
<details open><summary>Cartographie fonctionnelle</summary><label><input id="functional" type="checkbox"> Colorer et isoler les systèmes</label><select id="category"><option value="">Tous les systèmes</option></select><label for="system">Contrôleur enregistré</label><select id="system"><option value="">Tous les contrôleurs</option></select><label><input id="links" type="checkbox" checked> Afficher les liaisons enregistrées</label><button id="unlinked">Modules sans liaison</button><pre id="functional-info"></pre><div id="legend"></div></details>
<label for="type">Rechercher un type de bloc</label><input id="type" type="number" placeholder="Tous les types"><button id="search">Sélectionner</button><button id="isolate">Isoler la sélection</button><button id="reset">Tout afficher</button>
<label>Coupe locale <select id="axis"><option>X</option><option>Y</option><option>Z</option></select></label><input id="cut" type="range" min="-5" max="5" value="5" step="1"><output id="cut-value">Aucune</output>
<label>Vue</label><button id="perspective">Perspective</button><button id="orthographic">Orthographique</button><button id="frame">Recentrer</button>
<label>État de démonstration</label><button id="change">Modifier un bloc sélectionné</button><button id="compare">Comparer à l’état chargé</button>
<label>Exporter la vue</label><button id="png">PNG</button><button id="gltf" title="Export du snapshot avec approximation des shaders natifs">GLB simplifié</button>
<p id="status" role="status">Chargement…</p><pre id="details"></pre><p><a href="/isanth.html">Rendu StarMade d’Isanth</a></p></aside><section id="viewport"><div id="caption">Couleurs d’inspection · Cliquer pour sélectionner · Maj : sélection multiple</div></section></main><script type="module" src="./inspection.ts"></script></body></html>
